<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Установка даты и времени на приборке Freelander 2 через vLinker BLE.">
<title>Часы автомобиля</title>
<style>
  :root { color-scheme: dark; font: 16px/1.5 system-ui,sans-serif; background: #101713; color: #ecf5ed; }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 2rem 1rem; }
  main { max-width: 30rem; margin: auto; }
  h1 { margin: .35rem 0 .6rem; font-size: clamp(2rem, 8vw, 3rem); line-height: 1.05; }
  p { margin: 0 0 1rem; }
  .muted { color: #b6c4b8; }
  section { background: #1b261e; border: 1px solid #344537; border-radius: 1rem; padding: 1rem; margin-top: 1rem; }
  button, input, select { font: inherit; min-height: 3rem; border-radius: .65rem; }
  button { border: 1px solid #678073; color: inherit; background: #26392d; width: 100%; font-weight: 650; padding: .6rem; }
  button.primary { background: #c3ec91; color: #14210e; border-color: #c3ec91; }
  button:disabled { opacity: .5; }
  input[type=checkbox] { min-height: 0; width: 1.2rem; height: 1.2rem; accent-color: #c3ec91; }
  label { display: block; }
  .choice { display: flex; gap: .6rem; align-items: center; margin-bottom: 1rem; }
  input[type=date], input[type=time] { margin: .25rem 0 1rem; padding: .5rem; background: #101713; color: inherit; border: 1px solid #678073; }
  .models { color: #b6c4b8; }
  .device { display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:.7rem; }
  #connection { color:#c3ec91; font-size:.875rem; }
  .fields { display:grid; grid-template-columns:minmax(0,11.5rem) minmax(0,8.5rem); column-gap:.85rem; }
  .fields label { display:block; color:#b6c4b8; font-size:.875rem; min-width:0; }
  .fields input { display:block; width:100%; min-width:0; max-width:100%; -webkit-appearance:none; appearance:none; }
  .fields input::-webkit-date-and-time-value { min-width:0; margin:0; text-align:left; }
  .fields input:disabled { opacity:.85; }
  #status { min-height: 1.5em; margin: .7rem 0 0; color:#b6c4b8; overflow-wrap: anywhere; }
  details { margin-top:1rem; color:#b6c4b8; }
  .exit { margin-top: 1rem; } .exit a { color: #c3ec91; }
  :focus-visible { outline: 2px solid #daffb1; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Часы автомобиля</h1>
  <p class="models">Discovery 4 / Freelander 2 2013MY</p>
  <section aria-label="Адаптер">
    <div class="device"><strong>Адаптер</strong><span id="connection">Не подключён</span></div>
    <button id="connect" type="button">Подключить адаптер</button>
  </section>
  <section aria-label="Дата и время">
    <form id="clock">
      <label class="choice"><input id="phone" type="checkbox" checked> Дата и время телефона</label>
      <div class="fields">
        <label>Дата<input id="date" type="date" min="2000-01-01" max="2099-12-31" required disabled></label>
        <label>Время<input id="time" type="time" required disabled></label>
      </div>
      <button class="primary" id="send" disabled>Установить</button>
      <p id="status" role="status" aria-live="polite">Подключите адаптер.</p>
    </form>
  </section>
  <details><summary>Параметры CAN</summary><p><code>0x4F3</code> · MS-CAN · 125 кбит/с</p></details>
  <p class="exit"><a href="./download/FreelanderClockBLE.apk" download>Скачать APK для Android</a></p>
</main>
<script src="clock.js" defer></script>
</body>
</html>
